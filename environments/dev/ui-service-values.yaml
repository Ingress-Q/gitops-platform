replicaCount: 2

image:
  repository: 709476087242.dkr.ecr.us-east-1.amazonaws.com/ui-service
  tag: 14e21c3b9bcc7cf4576ebd0548bd405aea00d3aa

environment: dev

service:
  type: ClusterIP
  port: 8080

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70

podDisruptionBudget:
  enabled: true
  minAvailable: 1

serviceAccount:
  create: true
  name: ui-service

observability:
  logging:
    level: DEBUG

ingress:
  enabled: true
  className: alb
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/group.name: retail-store
  host: ""  # no custom domain — ALB DNS name auto-assigned, leave host unset for path-based routing
  path: /ui


env:
  AWS_REGION: us-east-1
  AWS_DEFAULT_REGION: us-east-1