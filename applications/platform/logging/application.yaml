apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: logging
  namespace: argocd

spec:
  project: platform

  source:
    repoURL: https://grafana.github.io/helm-charts
    chart: loki-stack
    targetRevision: 2.10.2

  destination:
    server: https://kubernetes.default.svc
    namespace: logging

  syncPolicy:
    automated:
      prune: true
      selfHeal: true