apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: checkout-service
  namespace: argocd

spec:
  project: workloads

  source:
    repoURL: https://github.com/Ingress-Q/checkout-service.git
    targetRevision: main
    path: helm

    helm:
      valueFiles:
        - $values/environments/dev/checkout-service-values.yaml

  destination:
    server: https://kubernetes.default.svc
    namespace: checkout

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

  sources:
    - repoURL: https://github.com/Ingress-Q/checkout-service.git
      targetRevision: main
      path: helm

    - repoURL: https://github.com/Ingress-Q/gitops-platform.git
      targetRevision: main
      ref: values
