apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cart-service
  namespace: argocd
spec:
  project: workloads
  sources:
    - repoURL: https://github.com/Ingress-Q/cart-service.git
      targetRevision: main
      path: cart-service
      helm:
        valueFiles:
          - $values/environments/dev/cart-service-values.yaml
    - repoURL: https://github.com/Ingress-Q/gitops-platform.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: cart
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true